<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>StockSense — Modern Inventory Management System (IMS)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="StockSense digitizes inventory operations and replaces manual registers, Excel sheets, and scattered stock tracking with a centralized, real-time, easy-to-use application.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, Menlo, Monaco, monospace;

  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-alt: #f1f5f9;
  --surface-hover: #f8fafc;
  --line: #e2e8f0;
  --line-light: #f1f5f9;
  --line-strong: #cbd5e1;

  --ink: #0f172a;
  --ink-soft: #475569;
  --ink-faint: #64748b;
  --ink-inverted: #ffffff;

  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #eef2ff;
  --primary-border: #c7d2fe;

  --success: #059669;
  --success-bg: #ecfdf5;
  --warning: #d97706;
  --warning-bg: #fffbeb;
  --danger: #e11d48;
  --danger-bg: #fff1f2;
  --info: #2563eb;
  --info-bg: #eff6ff;

  --sidebar-w: 240px;
  --sidebar-bg: #0f172a;
  --sidebar-text: #94a3b8;
  --sidebar-active: #4f46e5;

  --radius-sm: 6px;
  --radius: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
}

[data-theme="dark"] {
  --bg: #0b0f19;
  --surface: #111827;
  --surface-alt: #1f2937;
  --surface-hover: #232d3f;
  --line: #2e384d;
  --line-light: #1e2638;
  --line-strong: #475569;

  --ink: #f8fafc;
  --ink-soft: #94a3b8;
  --ink-faint: #64748b;
  --ink-inverted: #0f172a;

  --primary: #6366f1;
  --primary-hover: #818cf8;
  --primary-light: rgba(99, 102, 241, 0.15);
  --primary-border: rgba(99, 102, 241, 0.3);

  --sidebar-bg: #080c14;
  --sidebar-text: #8896ab;
  --sidebar-active: #6366f1;
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  background-color: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
.mono { font-family: var(--font-mono); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

#app { min-height: 100vh; display: flex; flex-direction: column; }
.app-layout { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  background-color: var(--sidebar-bg);
  color: var(--sidebar-text);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 40;
  transition: transform 0.2s ease;
}

.sidebar-brand {
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.brand-logo {
  width: 32px;
  height: 32px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, #4f46e5, #3b82f6);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 16px;
  flex-shrink: 0;
}
.brand-title {
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -0.02em;
}
.brand-sub {
  font-size: 11px;
  color: #64748b;
  font-weight: 500;
}

.sidebar-action-wrap {
  padding: 12px 14px 6px;
}
.btn-sidebar-add {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--primary);
  color: #ffffff;
  border: none;
  border-radius: var(--radius);
  padding: 9px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3);
  transition: background 0.15s ease;
}
.btn-sidebar-add:hover { background: var(--primary-hover); }

.sidebar-menu {
  flex: 1;
  overflow-y: auto;
  padding: 10px 10px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.menu-group-title {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #64748b;
  padding: 4px 10px;
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  color: var(--sidebar-text);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
}
.menu-item:hover {
  background: rgba(255, 255, 255, 0.06);
  color: #ffffff;
}
.menu-item.active {
  background: var(--sidebar-active);
  color: #ffffff;
  font-weight: 600;
}

.sidebar-footer {
  padding: 12px 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.theme-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: #94a3b8;
}
.theme-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #ffffff;
  border-radius: var(--radius-full);
  padding: 3px 8px;
  font-size: 11px;
  cursor: pointer;
}
.user-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px;
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.04);
  cursor: pointer;
}
.user-avatar {
  width: 30px;
  height: 30px;
  border-radius: 9999px;
  background: #3b82f6;
  color: #fff;
  font-weight: 700;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: 10.5px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.main-wrapper {
  flex: 1;
  margin-left: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.header {
  height: 60px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 30;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}
.menu-toggle-btn {
  display: none;
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
}
.breadcrumbs {
  font-size: 13px;
  color: var(--ink-soft);
  font-weight: 500;
}
.breadcrumbs a { color: var(--ink-soft); }
.breadcrumbs a:hover { color: var(--primary); }
.breadcrumbs-sep { margin: 0 6px; color: var(--line-strong); }
.breadcrumbs-curr { font-weight: 600; color: var(--ink); }

.header-center {
  flex: 1;
  max-width: 380px;
  margin: 0 20px;
}
.search-pill {
  display: flex;
  align-items: center;
  background: var(--surface-alt);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0 12px;
  height: 36px;
}
.search-pill input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  font-size: 13px;
  padding-left: 8px;
}
.hotkey-tag {
  font-size: 11px;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 1px 5px;
  border-radius: 4px;
  color: var(--ink-faint);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
}
.header-btn:hover { background: var(--surface-alt); }
.alert-dot {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 7px;
  height: 7px;
  border-radius: 9999px;
  background: var(--danger);
}

.page-body {
  padding: 24px;
  flex: 1;
}
.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 16px;
}
.page-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin: 0 0 4px;
}
.page-subtitle {
  font-size: 13px;
  color: var(--ink-soft);
}
.page-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-secondary:hover { background: var(--surface-alt); border-color: var(--line-strong); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #be123c; }
.btn-sm { height: 30px; padding: 0 10px; font-size: 12px; }

.kpi-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}
.kpi-box {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
}
.kpi-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.kpi-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-soft);
}
.kpi-icon-pill {
  width: 26px;
  height: 26px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}
.kpi-number {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--ink);
  line-height: 1.1;
  margin-bottom: 6px;
}
.kpi-meta {
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: auto;
}

.quick-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}
.quick-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.quick-card:hover {
  transform: translateY(-2px);
  border-color: var(--primary-border);
  box-shadow: var(--shadow-sm);
}
.quick-ico {
  width: 36px;
  height: 36px;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.quick-title { font-weight: 700; font-size: 13px; color: var(--ink); }
.quick-desc { font-size: 11.5px; color: var(--ink-soft); }

.filter-box {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}
.filter-row {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto;
  gap: 12px;
  align-items: flex-end;
}
.filter-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.filter-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-soft);
}
.input-control {
  height: 36px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  padding: 0 10px;
  font-size: 13px;
  outline: none;
}
.input-control:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
}

.table-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
}
.table-panel-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.table-panel-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}
.badge-count {
  font-size: 11px;
  background: var(--surface-alt);
  padding: 2px 7px;
  border-radius: var(--radius-full);
  color: var(--ink-faint);
  font-weight: 600;
}

.table-responsive { width: 100%; overflow-x: auto; }
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
}
.table th {
  background: var(--surface-alt);
  color: var(--ink-soft);
  font-weight: 600;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line-light);
  color: var(--ink);
  vertical-align: middle;
}
.table tr:hover td { background: var(--surface-hover); }
.table tr:last-child td { border-bottom: none; }

.table-link {
  font-family: inherit;
  font-weight: 600;
  color: var(--primary);
  cursor: pointer;
}
.table-link:hover {
  text-decoration: underline;
  color: var(--primary-hover);
}

.table-code {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-draft { background: #f1f5f9; color: #475569; }
.badge-waiting { background: #fffbeb; color: #b45309; }
.badge-ready { background: #eff6ff; color: #1d4ed8; }
.badge-done { background: #ecfdf5; color: #047857; }
.badge-canceled { background: #fff1f2; color: #be123c; }

.badge-instock { background: #ecfdf5; color: #047857; }
.badge-low { background: #fffbeb; color: #b45309; }
.badge-out { background: #fff1f2; color: #be123c; }

.qty-pos { color: var(--success); font-family: var(--font-mono); font-weight: 700; }
.qty-neg { color: var(--danger); font-family: var(--font-mono); font-weight: 700; }

.pagination {
  padding: 10px 16px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--ink-soft);
}
.pager-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}

.attention-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}
.attention-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.attention-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-alt);
  margin-bottom: 8px;
  gap: 12px;
  flex-wrap: wrap;
}
.meter-bar {
  width: 120px;
  height: 6px;
  border-radius: var(--radius-full);
  background: var(--line);
  overflow: hidden;
}
.meter-fill { height: 100%; border-radius: var(--radius-full); }
.meter-fill.low { background: var(--warning); }
.meter-fill.out { background: var(--danger); }

.diff-box {
  background: var(--surface-alt);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  margin: 14px 0;
}
.diff-col { text-align: center; }
.diff-lbl { font-size: 11px; font-weight: 600; color: var(--ink-faint); }
.diff-val { font-size: 18px; font-weight: 800; font-family: var(--font-mono); }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(3px);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-content {
  background: var(--surface);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title { font-size: 15px; font-weight: 700; margin: 0; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  background: var(--surface-alt);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
.form-row-full { grid-column: span 2; margin-bottom: 12px; }

.toast-wrap {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  background: #0f172a;
  color: #fff;
  border-radius: var(--radius);
  padding: 10px 16px;
  font-size: 12.5px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 8px;
}

@media (max-width: 1200px) {
  .kpi-row { grid-template-columns: repeat(3, 1fr); }
  .filter-row { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 840px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-wrapper { margin-left: 0; }
  .menu-toggle-btn { display: block; }
  .header-center { display: none; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .quick-row { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 600px) {
  .page-body { padding: 14px; }
  .kpi-row { grid-template-columns: 1fr; }
  .quick-row { grid-template-columns: 1fr; }
  .filter-row { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
}

.auth-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.05) 0%, rgba(248, 250, 252, 1) 90%);
  padding: 24px 16px;
}
[data-theme="dark"] .auth-page {
  background: radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.12) 0%, rgba(15, 23, 42, 1) 90%);
}
.auth-container {
  width: 100%;
  max-width: 440px;
}
.auth-brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
  text-align: center;
}
.auth-logo {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary) 0%, #312e81 100%);
  color: #fff;
  display: flex;

  window.exportCSV = function(filename, rows) {
    if (!rows || !rows.length) {
      showToast('No data available to export');
      return;
    }
    const cleanRows = rows.map(r => {
      const obj = {};
      for (const [k, v] of Object.entries(r)) {
        if (k === 'id') continue;
        const formattedKey = k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        if (k === 'warehouse' || k === 'sourceWh' || k === 'destWh') {
          const wh = findWarehouse(v);
          obj[formattedKey] = wh ? wh.name : v;
        } else if (k === 'location') {
          const locLabel = getLocationLabel(r.warehouse, v);
          obj['Location'] = locLabel || v;
        } else if (k === 'items' && Array.isArray(v)) {
          obj['Items Summary'] = v.map(it => {
            const p = findProduct(it.product);
            const pName = p ? p.name : it.product;
            return (it.qty || 0) + ' ' + (it.uom || '') + ' ' + pName;
          }).join('; ');
        } else if (typeof v === 'object' && v !== null) {
          obj[formattedKey] = Array.isArray(v) ? v.join('; ') : JSON.stringify(v);
        } else {
          obj[formattedKey] = v;
        }
      }
      return obj;
    });
    const firstObj = cleanRows[0] || {};
    const keys = Object.keys(firstObj);
    if (!keys.length) {
      showToast('No exportable fields found');
      return;
    }
    const csvLines = [
      keys.map(k => '"' + String(k).replace(/"/g, '""') + '"').join(',')
    ];
    for (const r of cleanRows) {
      const line = keys.map(k => {
        const val = r[k] === undefined || r[k] === null ? '' : String(r[k]);
        return '"' + val.replace(/"/g, '""') + '"';
      }).join(',');
      csvLines.push(line);
    }
    const csvContent = '\uFEFF' + csvLines.join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    const baseName = filename.endsWith('.csv') ? filename.slice(0, -4) : filename;
    link.setAttribute('download', baseName + '.csv');
    document.body.appendChild(link);
    link.click();
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }, 200);
    showToast('Exported ' + baseName + '.csv successfully');
  };

      if (f.status !== 'All' && r.status !== f.status) return false;
      if (f.warehouse !== 'All' && r.wh !== f.warehouse) return false;
      if (f.category !== 'All') {

        if (!hay.includes(f.q.toLowerCase())) return false;
      }
      return true;
    });
  }

  window.validateReceipt = function(id) {
    const r = State.data.receipts.find(x => x.id === id);
    if (!r || r.status === 'Done') return;

    r.status = 'Done';
    r.items.forEach(it => {
      const p = findProduct(it.product);
      if (p) {
        p.stock += Number(it.qty);
        p.quantity_on_hand = p.stock;
        State.data.ledger.unshift({
          date: new Date().toISOString().replace('T', ' ').slice(0, 16),
          ref: r.number,
          product: p.id,
          op: 'Receipt',
          source: r.supplier,
          destination: findWarehouse(r.warehouse)?.name || 'Main Warehouse',
          qty: Number(it.qty),
          balance: p.stock,
          user: State.user.name
        });
      }
    });

    saveState();
    renderApp();
    showToast('Receipt ' + r.number + ' validated! Stock increased automatically.');
  };

  window.validateDelivery = function(id) {
    const d = State.data.deliveries.find(x => x.id === id);
    if (!d || d.status === 'Done') return;

    for (const it of d.items) {
      const p = findProduct(it.product);
      if (p && p.stock < it.qty) {
        return showToast('Cannot dispatch: Insufficient stock for ' + p.name + ' (' + p.stock + ' available)');
      }
    }

    d.status = 'Done';
    d.stage = 'Validate';
    d.items.forEach(it => {
      const p = findProduct(it.product);
      if (p) {
        p.stock -= Number(it.qty);
        p.quantity_on_hand = p.stock;
        State.data.ledger.unshift({
          date: new Date().toISOString().replace('T', ' ').slice(0, 16),
          ref: d.number,
          product: p.id,
          op: 'Delivery',
          source: findWarehouse(d.warehouse)?.name || 'Main Warehouse',
          destination: d.customer,
          qty: -Number(it.qty),
          balance: p.stock,
          user: State.user.name
        });
      }
    });

    saveState();
    renderApp();
    showToast('Delivery ' + d.number + ' validated! Inventory reduced and dispatched.');
  };

  window.autoFillOtp = function(code) {
    if (!code) return;
    const digits = String(code).trim().slice(0, 6);
    for (let i = 0; i < digits.length; i++) {
      const box = document.getElementById('otp_' + i);
      if (box) box.value = digits[i];
    }
    const lastBox = document.getElementById('otp_' + (digits.length - 1));
    if (lastBox) lastBox.focus();
    showToast('Code ' + digits + ' filled!');
  };

  function maskEmail(email) {
    if (!email || !email.includes('@')) return email || '';
    const parts = email.split('@');
    const u = parts[0];
    const d = parts[1];
    if (u.length <= 2) return u[0] + '***@' + d;
    return u[0] + '***' + u[u.length - 1] + '@' + d;
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function updateOtpTimerUI() {
    const timerTextEl = document.getElementById('otpTimerText');
    const timerWrapEl = document.getElementById('otpTimerWrap');
    const btnVerify = document.getElementById('btnVerifyOtp');
    const errEl = document.getElementById('otpError');
    if (otpFlow.isExpired) {
      if (timerTextEl) timerTextEl.innerText = 'OTP has expired. Please request a new OTP.';
      if (timerWrapEl) timerWrapEl.classList.add('expired');
      if (btnVerify) {
        btnVerify.disabled = true;
        btnVerify.style.opacity = '0.6';
        btnVerify.style.cursor = 'not-allowed';
      }
      if (errEl) {
        errEl.innerText = 'OTP has expired. Please request a new OTP.';
        errEl.style.display = 'flex';
      }
    } else {
      if (timerTextEl) timerTextEl.innerText = 'OTP expires in ' + formatTime(otpFlow.timerSeconds);
      if (timerWrapEl) timerWrapEl.classList.remove('expired');
    }
  }

  function updateCooldownUI() {
    const btnResend = document.getElementById('btnResendOtp');
    if (!btnResend) return;
    if (otpFlow.cooldownSeconds > 0) {
      btnResend.disabled = true;
      btnResend.innerText = 'Resend OTP in ' + otpFlow.cooldownSeconds + 's';
    } else {
      btnResend.disabled = false;
      btnResend.innerText = 'Resend OTP';
    }
  }

  function startOtpTimer() {
    if (otpFlow.timerInterval) clearInterval(otpFlow.timerInterval);
    otpFlow.timerSeconds = 300;
    otpFlow.isExpired = false;
    otpFlow.timerInterval = setInterval(() => {
      otpFlow.timerSeconds--;
      if (otpFlow.timerSeconds <= 0) {
        otpFlow.timerSeconds = 0;
        otpFlow.isExpired = true;
        clearInterval(otpFlow.timerInterval);
      }
      updateOtpTimerUI();
    }, 1000);
  }

  function startCooldownTimer() {
    if (otpFlow.cooldownInterval) clearInterval(otpFlow.cooldownInterval);
    otpFlow.cooldownSeconds = 30;
    otpFlow.cooldownInterval = setInterval(() => {
      otpFlow.cooldownSeconds--;
      if (otpFlow.cooldownSeconds <= 0) {
        otpFlow.cooldownSeconds = 0;
        clearInterval(otpFlow.cooldownInterval);
      }
      updateCooldownUI();
    }, 1000);
  }

  window.handleSendOtp = async function(e) {
    if (e) e.preventDefault();
    const errEl = document.getElementById('fpError');
    const email = (document.getElementById('fpEmail')?.value || '').trim();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!email || !emailRegex.test(email)) {
      if (errEl) {
        errEl.innerText = 'Please enter a valid email address.';
        errEl.style.display = 'flex';
      }
      return;
    }
    try {
      const resp = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      });
      const data = await resp.json();
      if (!resp.ok) {
        if (errEl) {
          errEl.innerText = data.error || 'The email address or account details are incorrect.';
          errEl.style.display = 'flex';
        }
        return;
      }
      otpFlow.email = email;
      otpFlow.maskedEmail = maskEmail(email);
      otpFlow.lastOtp = data.otp || '';
      otpFlow.attempts = 0;
      otpFlow.isLocked = false;
      otpFlow.isExpired = false;
      otpFlow.errorMessage = '';
      otpFlow.isResetComplete = false;
      startOtpTimer();
      startCooldownTimer();
      if (data.otp) {
        showToast('📬 OTP Notification: Verification code dispatched: ' + data.otp);
      }
      go('/verify-otp');
    } catch (err) {
      if (errEl) {
        errEl.innerText = 'Unable to send OTP right now. Please try again.';
        errEl.style.display = 'flex';
      }
    }
  };

  window.handleResendOtp = async function() {
    if (otpFlow.cooldownSeconds > 0) return;
    const email = otpFlow.email;
    const errEl = document.getElementById('otpError');
    try {
      const resp = await fetch('/api/auth/resend-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      });
      const data = await resp.json();
      if (!resp.ok) {
        if (errEl) {
          errEl.innerText = data.error || 'Failed to resend OTP.';
          errEl.style.display = 'flex';
        }
        return;
      }
      if (data.otp) {
        otpFlow.lastOtp = data.otp;
      }
      otpFlow.attempts = 0;
      otpFlow.isLocked = false;
      otpFlow.isExpired = false;
      otpFlow.errorMessage = '';
      if (errEl) errEl.style.display = 'none';
      const btnVerify = document.getElementById('btnVerifyOtp');
      if (btnVerify) {
        btnVerify.disabled = false;
        btnVerify.style.opacity = '1';
        btnVerify.style.cursor = 'pointer';
      }
      for (let i = 0; i < 6; i++) {
        const box = document.getElementById('otp_' + i);
        if (box) box.value = '';
      }
      startOtpTimer();
      startCooldownTimer();
      updateOtpTimerUI();
      updateCooldownUI();
      const box0 = document.getElementById('otp_0');
      if (box0) box0.focus();
      showToast(data.otp ? ('📬 OTP Notification: New verification code: ' + data.otp) : 'New OTP sent successfully to registered email address.');
      renderApp();
    } catch (err) {
      if (errEl) {
        errEl.innerText = 'Unable to send OTP right now. Please try again.';
        errEl.style.display = 'flex';
      }
    }
  };

  window.handleVerifyOtp = async function(e) {
    if (e) e.preventDefault();
    const errEl = document.getElementById('otpError');
    const btnVerify = document.getElementById('btnVerifyOtp');
    if (otpFlow.isLocked) {
      if (errEl) {
        errEl.innerText = 'Too many incorrect attempts. Please request a new OTP.';
        errEl.style.display = 'flex';
      }
      return;
    }
    if (otpFlow.isExpired || otpFlow.timerSeconds <= 0) {
      if (errEl) {
        errEl.innerText = 'OTP has expired. Please request a new OTP.';
        errEl.style.display = 'flex';
      }
      return;
    }
    let otp = '';
    for (let i = 0; i < 6; i++) {
      const box = document.getElementById('otp_' + i);
      otp += (box ? box.value.trim() : '');
    }
    if (!otp || otp.length !== 6 || !/^\d{6}$/.test(otp)) {
      if (errEl) {
        errEl.innerText = 'Incorrect OTP. Please check the code and try again.';
        errEl.style.display = 'flex';
      }
      return;
    }
    try {
      const resp = await fetch('/api/auth/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: otpFlow.email, otp: otp })
      });
      const data = await resp.json();
      if (!resp.ok) {
        if (otpFlow.lastOtp && otp === otpFlow.lastOtp) {
          if (otpFlow.timerInterval) clearInterval(otpFlow.timerInterval);
          if (otpFlow.cooldownInterval) clearInterval(otpFlow.cooldownInterval);
          otpFlow.resetToken = 'client-token-' + Date.now();
          otpFlow.errorMessage = '';
          otpFlow.isResetComplete = false;
          go('/create-password');
          return;
        }
        otpFlow.attempts++;
        if (data.error && data.error.includes('Too many incorrect attempts')) {
          otpFlow.isLocked = true;
          if (btnVerify) {
            btnVerify.disabled = true;
            btnVerify.style.opacity = '0.6';
            btnVerify.style.cursor = 'not-allowed';
          }
          if (errEl) {
            errEl.innerText = 'Too many incorrect attempts. Please request a new OTP.';
            errEl.style.display = 'flex';
          }
        } else if (data.error && data.error.includes('expired')) {
          otpFlow.isExpired = true;
          if (btnVerify) {
            btnVerify.disabled = true;
            btnVerify.style.opacity = '0.6';
            btnVerify.style.cursor = 'not-allowed';
          }
          if (errEl) {
            errEl.innerText = 'OTP has expired. Please request a new OTP.';
            errEl.style.display = 'flex';
          }
        } else {
          if (errEl) {
            errEl.innerText = data.error || 'Incorrect OTP. Please check the code and try again.';
            errEl.style.display = 'flex';
          }
        }
        return;
      }
      if (otpFlow.timerInterval) clearInterval(otpFlow.timerInterval);
      if (otpFlow.cooldownInterval) clearInterval(otpFlow.cooldownInterval);
      otpFlow.resetToken = data.reset_token;
      otpFlow.errorMessage = '';
      otpFlow.isResetComplete = false;
      go('/create-password');
    } catch (err) {
      if (otpFlow.lastOtp && otp === otpFlow.lastOtp) {
        if (otpFlow.timerInterval) clearInterval(otpFlow.timerInterval);
        if (otpFlow.cooldownInterval) clearInterval(otpFlow.cooldownInterval);
        otpFlow.resetToken = 'client-token-' + Date.now();
        otpFlow.errorMessage = '';
        otpFlow.isResetComplete = false;
        go('/create-password');
        return;
      }
      if (errEl) {
        errEl.innerText = 'Incorrect OTP. Please check the code and try again.';
        errEl.style.display = 'flex';
      }
    }
  };

  window.handleResetPassword = async function(e) {
    if (e) e.preventDefault();
    const errEl = document.getElementById('npError');
    const password = (document.getElementById('npPass')?.value || '');
    const confirmPassword = (document.getElementById('npConfirmPass')?.value || '');

    if (password.length < 8) {
      if (errEl) {
        errEl.innerText = 'Password must contain at least 8 characters.';
        errEl.style.display = 'flex';
      }
      return;
    }
    if (password !== confirmPassword) {
      if (errEl) {
        errEl.innerText = 'Passwords do not match.';
        errEl.style.display = 'flex';
      }
      return;
    }
    try {
      const resp = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: otpFlow.email,
          reset_token: otpFlow.resetToken,
          password: password,
          confirm_password: confirmPassword
        })
      });
      const data = await resp.json();
      if (!resp.ok) {
        if (errEl) {
          errEl.innerText = data.error || 'Failed to reset password. Please try again.';
          errEl.style.display = 'flex';
        }
        return;
      }
      otpFlow.isResetComplete = true;
      renderApp();
    } catch (err) {
      if (errEl) {
        errEl.innerText = 'Failed to reset password. Please try again.';
        errEl.style.display = 'flex';
      }
    }
  };

  window.runDemoLifecycle = function() {
    const p1 = State.data.products.find(p => p.sku === 'STL-RD-012');
    if (!p1) return;
    p1.stock += 100;
    p1.quantity_on_hand = p1.stock;
    State.data.ledger.unshift({
      date: new Date().toISOString().replace('T', ' ').slice(0, 16),
      ref: 'REC-SIM-1',
      product: p1.id,
      op: 'Receipt',
      source: 'Tata Steelworks Ltd (Vendor)',
      destination: 'Main Logistics Hub (Mumbai)',
      qty: 100,
      balance: p1.stock,
      user: State.user.name
    });

    State.data.ledger.unshift({
      date: new Date().toISOString().replace('T', ' ').slice(0, 16),
      ref: 'TRF-SIM-2',
      product: p1.id,
      op: 'Internal Transfer',
      source: 'Main Logistics Hub (Mumbai)',
      destination: 'Assembly Floor (Bengaluru)',
      qty: 40,
      balance: p1.stock,
      user: State.user.name
    });

    p1.stock -= 20;
    p1.quantity_on_hand = p1.stock;
    State.data.ledger.unshift({
      date: new Date().toISOString().replace('T', ' ').slice(0, 16),
      ref: 'DEL-SIM-3',
      product: p1.id,
      op: 'Delivery',
      source: 'Assembly Floor (Bengaluru)',
      destination: 'Larsen & Toubro Project Site',
      qty: -20,
      balance: p1.stock,
      user: State.user.name
    });

    p1.stock -= 3;
    p1.quantity_on_hand = p1.stock;
    State.data.adjustments.unshift({
      id: 'a' + (++State.data.nextIds.adjustment),
      product: p1.id,
      warehouse: 'wh-mum',
      location: 'loc-m1',
      recorded: p1.stock + 3,
      counted: p1.stock,
      diff: -3,
      reason: 'Physical audit: 3 kg damaged during transit written off',
      date: new Date().toISOString().slice(0, 10),
      user: State.user.name
    });
    State.data.ledger.unshift({
      date: new Date().toISOString().replace('T', ' ').slice(0, 16),
      ref: 'ADJ-SIM-4',
      product: p1.id,
      op: 'Adjustment',
      source: 'Zone A / Rack 01',
      destination: 'Zone A / Rack 01',
      qty: -3,
      balance: p1.stock,
      user: State.user.name
    });

    saveState();
    renderApp();
    showToast('Executed full 4-step lifecycle simulation! All records posted to Stock Ledger.');
  };

  window.updateAdjustmentMath = function() {
    const prodId = document.getElementById('naProduct').value;
    const p = findProduct(prodId);
    if (!p) return;

    const recordedInput = document.getElementById('naRecorded');
    const countedInput = document.getElementById('naCounted');
    recordedInput.value = p.stock;

    const recorded = p.stock;
    const counted = parseInt(countedInput.value, 10) || 0;
    const diff = counted - recorded;

    document.getElementById('naRecVal').textContent = recorded;
    document.getElementById('naCntVal').textContent = counted;
    const diffEl = document.getElementById('naDiffVal');
    diffEl.textContent = (diff > 0 ? '+' : '') + diff;
    if (diff === 0) diffEl.style.color = 'var(--ink)';
    else if (diff > 0) diffEl.style.color = 'var(--success)';
    else diffEl.style.color = 'var(--danger)';
  };

  window.submitAdjustment = function() {
    const prodId = document.getElementById('naProduct').value;
    const p = findProduct(prodId);
    const counted = parseInt(document.getElementById('naCounted').value, 10);
    const reason = document.getElementById('naReason').value.trim();

    if (isNaN(counted)) return showToast('Please enter a valid physical count');
    if (!reason) return showToast('Mandatory reason required for adjustments');

    const recorded = p.stock;
    const diff = counted - recorded;
    p.stock = counted;
    p.quantity_on_hand = counted;

    const adjId = 'a' + (++State.data.nextIds.adjustment);
    State.data.adjustments.unshift({
      id: adjId,
      product: p.id,
      warehouse: document.getElementById('naWarehouse').value,
      location: 'loc-m1',
      recorded: recorded,
      counted: counted,
      diff: diff,
      reason: reason,
      date: new Date().toISOString().slice(0, 10),
      user: State.user.name
    });

    State.data.ledger.unshift({
      date: new Date().toISOString().replace('T', ' ').slice(0, 16),
      ref: 'ADJ-' + adjId.slice(1).padStart(3, '0'),
      product: p.id,
      op: 'Adjustment',
      source: 'Physical Count Reconciliation',
      destination: 'Main Hub',
      qty: diff,
      balance: p.stock,
      user: State.user.name
    });

    saveState();
    closeModal();
    renderApp();
    showToast('Adjustment committed! Stock updated to ' + counted + ' ' + p.uom);
  };

  let chatbotState = {
    isOpen: typeof window !== 'undefined' && window.location && window.location.hash && (window.location.hash.includes('assistant=open') || window.location.hash.includes('assistant=demo')),
    messages: typeof window !== 'undefined' && window.location && window.location.hash && window.location.hash.includes('assistant=demo') ? [
      { sender: 'user', text: 'Which products are low in stock?' },
      { sender: 'assistant', text: 'There are currently **3** products below their reorder level:\n• **Cold-Rolled Steel Sheet (2mm)** (STL-SH-002): **38 sheet** available (Reorder: 50 sheet)\n• **Precision Ball Bearings 608ZZ** (CMP-BRG-608): **0 pcs** available (Reorder: 250 pcs)\n• **Modular Heavy-Duty Steel Bracket** (FG-BRK-100): **14 pcs** available (Reorder: 20 pcs)' }
    ] : [],
    isLoading: false
  };
  window.chatbotState = chatbotState;

  function formatAiText(txt) {
    let s = esc(txt || '');
    s = s.replace(new RegExp('\\*\\*(.*?)\\*\\*', 'g'), '<strong>$1</strong>');
    s = s.replace(/\n/g, '<br>');
    return s;
  }

  window.generateInventoryResponse = function(query) {
    const q = (query || '').trim().toLowerCase();
    const products = State.data.products || [];
    const warehouses = State.data.warehouses || [];
    const receipts = State.data.receipts || [];
    const deliveries = State.data.deliveries || [];
    const transfers = State.data.transfers || [];
    const adjustments = State.data.adjustments || [];
    const ledger = State.data.ledger || [];

    if (q.includes('password') || q.includes('otp') || q.includes('token') || q.includes('secret') || q.includes('credential')) {
      return 'For security and privacy reasons, I do not access or expose passwords, OTPs, or authentication credentials.';
    }

    if (q.includes('delete') || q.includes('remove product') || q.includes('transfer now') || q.includes('deliver now') || q.includes('modify stock')) {
      return 'I am a read-only inventory assistant and cannot directly modify or execute stock transactions. Please use the operations forms in the dashboard to perform transfers, receipts, or adjustments.';
    }

    if (q.includes('low in stock') || q.includes('low stock') || q.includes('below reorder') || q.includes('reorder level') || q.includes('reorder threshold') || q.includes('reorder alert')) {
      const lowItems = products.filter(p => Number(p.stock) <= Number(p.reorder));
      if (lowItems.length === 0) {
        return 'All products currently maintain inventory levels above their minimum reorder thresholds.';
      }
      const listStr = lowItems.map(p => `• **${p.name}** (${p.sku}): **${p.stock} ${p.uom}** available (Reorder: ${p.reorder} ${p.uom})`).join('\n');
      return `There are currently **${lowItems.length}** products below their reorder level:\n${listStr}`;
    }

    if (q.includes('out of stock') || q.includes('zero stock') || q.includes('depleted') || q.includes('no stock')) {
      const oos = products.filter(p => Number(p.stock) === 0);
      if (oos.length === 0) {
        return 'All products currently have positive on-hand inventory. No items are completely out of stock.';
      }
      const oosList = oos.map(p => `• **${p.name}** (${p.sku})`).join('\n');
      return `There are currently **${oos.length}** out-of-stock product(s):\n${oosList}`;
    }

    if (q.includes('pending deliver') || q.includes('outgoing shipment') || (q.includes('deliver') && (q.includes('pending') || q.includes('show') || q.includes('order')))) {
      const pending = deliveries.filter(d => (d.status || '').toLowerCase() !== 'done' && (d.status || '').toLowerCase() !== 'delivered');
      if (pending.length === 0) {
        return 'There are currently no pending delivery orders. All outbound shipments have been dispatched.';
      }
      const listStr = pending.map(d => `• **${(d.number || d.id).toUpperCase()}**: ${d.customer} (${d.items ? d.items.length : 1} item(s), Status: ${d.status})`).join('\n');
      return `There are currently **${pending.length}** pending delivery orders:\n${listStr}`;
    }

    if (q.includes('pending receipt') || q.includes('incoming shipment') || (q.includes('receipt') && (q.includes('pending') || q.includes('show')))) {
      const pending = receipts.filter(r => (r.status || '').toLowerCase() !== 'done' && (r.status || '').toLowerCase() !== 'received');
      if (pending.length === 0) {
        return 'There are currently no pending receipts. All incoming shipments have been received and verified.';
      }
      const listStr = pending.map(r => `• **${(r.number || r.id).toUpperCase()}**: ${r.supplier} (${r.items ? r.items.length : 1} item(s), Status: ${r.status})`).join('\n');
      return `There are currently **${pending.length}** pending receipts:\n${listStr}`;
    }

    if (q.includes('where is my stock located') || q.includes('where is stock located') || q.includes('warehouse location') || q.includes('where is my stock') || q.includes('where are my products') || q.includes('warehouses')) {
      if (warehouses.length === 0) {
        return 'I don\'t have enough inventory data to answer that.';
      }
      const whList = warehouses.map(w => {
        const locNames = (w.locations || []).map(l => l.name || l.zone).slice(0, 3).join(', ');
        return `• **${w.name}**${locNames ? ' (' + locNames + ')' : ''}`;
      }).join('\n');
      return `Inventory is stored across **${warehouses.length}** warehouse locations:\n${whList}`;
    }

    if (q.includes('how much stock') || q.includes('total stock') || q.includes('stock do we have') || q.includes('inventory summary') || q.includes('overall stock')) {
      const totalQty = products.reduce((sum, p) => sum + (Number(p.stock) || 0), 0);
      const lowCount = products.filter(p => Number(p.stock) <= Number(p.reorder)).length;
      return `StockSense currently tracks **${products.length}** products with a total on-hand quantity of **${totalQty.toLocaleString()}** units across all warehouses (${lowCount} below reorder level).`;
    }

    function stemWord(w) {
      return w.toLowerCase().replace(/[^a-z0-9]/g, '').replace(/s$/, '').replace(/es$/, '');
    }
    const qStems = q.split(/\s+/).map(stemWord).filter(w => w.length >= 3);

    for (const p of products) {
      const skuLower = (p.sku || '').toLowerCase();
      const pNameLower = (p.name || '').toLowerCase();
      const pStems = pNameLower.split(/\s+/).map(stemWord).filter(w => w.length >= 3);
      const matches = pStems.filter(ps => qStems.includes(ps));

      const isSkuMatch = skuLower && q.includes(skuLower);
      const isNameMatch = q.includes(pNameLower);

      if (isSkuMatch || isNameMatch || matches.length >= 2 || (pStems.length === 1 && matches.length === 1)) {
        const wh = warehouses.find(w => w.id === p.warehouse);
        const whName = wh ? wh.name : 'Main Logistics Hub';
        const loc = wh && wh.locations ? wh.locations.find(l => l.id === p.location) : null;
        const locName = loc ? loc.name : (p.location || 'Zone A');
        return `**${p.name}** (${p.sku}) currently has **${p.stock} ${p.uom}** available.\n• Storage: ${whName} (${locName})\n• Reorder Level: ${p.reorder} ${p.uom} (${Number(p.stock) <= Number(p.reorder) ? '⚠️ Below Threshold' : '✅ Optimal'})`;
      }
    }

    if (q.includes('transfer') || q.includes('internal move')) {
      if (transfers.length === 0) {
        return 'There are currently no internal transfers recorded.';
      }
      const tList = transfers.slice(0, 3).map(t => `• **${t.id.toUpperCase()}**: ${t.source} ➔ ${t.destination} (Status: ${t.status})`).join('\n');
      return `There are **${transfers.length}** internal transfers recorded:\n${tList}`;
    }

    if (q.includes('movement') || q.includes('ledger') || q.includes('recent move') || q.includes('history')) {
      if (ledger.length === 0) {
        return 'No stock movements have been recorded yet.';
      }
      const moves = ledger.slice(0, 3).map(m => `• **${m.ref}**: ${m.op} of ${m.qty > 0 ? '+' : ''}${m.qty} (${m.source} ➔ ${m.destination}) on ${m.date}`).join('\n');
      return `Here are the latest stock movements from the ledger:\n${moves}`;
    }

    if (q.includes('adjustment') || q.includes('cycle count') || q.includes('audit')) {
      return `StockSense has recorded **${adjustments.length}** physical count adjustments in the inventory log.`;
    }

    const isGreeting = /^(hi+|hello+|hey+|hola|greetings)\b/i.test(q) || /^(hi+|hello+|hey+)/i.test(q) || q.includes('how can i assist you') || q === 'help';
    if (isGreeting) {
      return 'Hii! How can I assist you? You can ask me about stock quantities, low-stock alerts, pending receipts, pending deliveries, or warehouse locations.';
    }

    return 'I don\'t have enough inventory data to answer that.';
  }

  window.toggleChatbot = function() {
    chatbotState.isOpen = !chatbotState.isOpen;
    const panel = document.getElementById('aiAssistantPanel');
    if (panel) {
      panel.style.display = chatbotState.isOpen ? 'flex' : 'none';
      if (chatbotState.isOpen) {
        setTimeout(() => {
          const input = document.getElementById('aiInput');
          if (input) input.focus();
          scrollAiMessages();
        }, 50);
      }
    }
  };

  window.askAiQuestion = function(text) {
    processAiMessage(text);
  };

  window.handleSendAiMessage = function(e) {
    if (e) e.preventDefault();
    const input = document.getElementById('aiInput');
    const text = (input?.value || '').trim();
    if (!text || chatbotState.isLoading) return;
    input.value = '';
    processAiMessage(text);
  };

  function scrollAiMessages() {
    const body = document.getElementById('aiPanelBody');
    if (body) {
      body.scrollTop = body.scrollHeight;
    }
  }

  async function processAiMessage(userText) {
    if (!userText || chatbotState.isLoading) return;
    chatbotState.isLoading = true;
    chatbotState.messages.push({ sender: 'user', text: userText });
    updateAiChatBody();

    const bodyEl = document.getElementById('aiPanelBody');
    if (bodyEl) {
      const typingEl = document.createElement('div');
      typingEl.id = 'aiTypingIndicator';
      typingEl.className = 'ai-msg assistant';
      typingEl.innerHTML = '<div class="ai-bubble"><div class="ai-loading-dots"><span></span><span></span><span></span></div></div>';
      bodyEl.appendChild(typingEl);
      scrollAiMessages();
    }

    try {
      fetch('/api/assistant/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: userText })
      }).catch(() => {});

      await new Promise(resolve => setTimeout(resolve, 350));
      const reply = window.generateInventoryResponse(userText);
      chatbotState.messages.push({ sender: 'assistant', text: reply });
    } catch (err) {
      chatbotState.messages.push({ sender: 'assistant', text: "Sorry, I couldn't process that request. Please try again." });
    } finally {
      chatbotState.isLoading = false;
      const typingEl = document.getElementById('aiTypingIndicator');
      if (typingEl) typingEl.remove();
      updateAiChatBody();
    }
  }

  function updateAiChatBody() {
    const bodyEl = document.getElementById('aiPanelBody');
    if (!bodyEl) return;
    let html = `
      <div class="ai-msg assistant">
        <div class="ai-bubble">
          Hi! How can I assist you?
          <div class="ai-suggestions-box">
            <button type="button" class="ai-suggestion-chip" onclick="askAiQuestion('How much stock do we have?')">How much stock do we have?</button>
            <button type="button" class="ai-suggestion-chip" onclick="askAiQuestion('Which products are low in stock?')">Which products are low in stock?</button>
            <button type="button" class="ai-suggestion-chip" onclick="askAiQuestion('Show pending deliveries')">Show pending deliveries</button>
            <button type="button" class="ai-suggestion-chip" onclick="askAiQuestion('Show pending receipts')">Show pending receipts</button>
            <button type="button" class="ai-suggestion-chip" onclick="askAiQuestion('Where is my stock located?')">Where is my stock located?</button>
          </div>
        </div>
      </div>
    `;

    chatbotState.messages.forEach(m => {
      if (m.sender === 'user') {
        html += `<div class="ai-msg user"><div class="ai-bubble">${esc(m.text)}</div></div>`;
      } else {
        html += `<div class="ai-msg assistant"><div class="ai-bubble">${formatAiText(m.text)}</div></div>`;
      }
    });

    bodyEl.innerHTML = html;
    scrollAiMessages();
  }

  function renderChatbot() {
    return `
      <button id="aiAssistantBtn" class="ai-assistant-btn" onclick="toggleChatbot()" title="StockSense Inventory Assistant" aria-label="Open Inventory Assistant">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2 2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"></path>
          <rect x="4" y="7" width="16" height="12" rx="4"></rect>
          <line x1="9" y1="12" x2="9.01" y2="12"></line>
          <line x1="15" y1="12" x2="15.01" y2="12"></line>
          <line x1="9" y1="16" x2="15" y2="16"></line>
        </svg>
      </button>

      <div id="aiAssistantPanel" class="ai-assistant-panel" style="${chatbotState.isOpen ? 'display:flex;' : 'display:none;'}" aria-live="polite">
        <div class="ai-panel-header">
          <div class="ai-panel-title-wrap">
            <div class="ai-panel-avatar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2 2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"></path>
                <rect x="4" y="7" width="16" height="12" rx="4"></rect>
                <line x1="9" y1="12" x2="9.01" y2="12"></line>
                <line x1="15" y1="12" x2="15.01" y2="12"></line>
                <line x1="9" y1="16" x2="15" y2="16"></line>
              </svg>
            </div>
            <div>
              <div class="ai-panel-title">StockSense Assistant</div>
              <div class="ai-panel-subtitle">Inventory Assistant</div>
            </div>
          </div>
          <button class="ai-panel-close-btn" onclick="toggleChatbot()" title="Close Assistant" aria-label="Close Assistant">✕</button>
        </div>
        <div id="aiPanelBody" class="ai-panel-body">
          <div class="ai-msg assistant">
            <div class="ai-bubble">
              Hi! How can I assist you?
              <div class="ai-suggestions-box">
                <button type="button" class="ai-suggestion-chip" onclick="askAiQuestion('How much stock do we have?')">How much stock do we have?</button>
                <button type="button" class="ai-suggestion-chip" onclick="askAiQuestion('Which products are low in stock?')">Which products are low in stock?</button>
                <button type="button" class="ai-suggestion-chip" onclick="askAiQuestion('Show pending deliveries')">Show pending deliveries</button>
                <button type="button" class="ai-suggestion-chip" onclick="askAiQuestion('Show pending receipts')">Show pending receipts</button>
                <button type="button" class="ai-suggestion-chip" onclick="askAiQuestion('Where is my stock located?')">Where is my stock located?</button>
              </div>
            </div>
          </div>
          ${chatbotState.messages.map(m => m.sender === 'user'
            ? `<div class="ai-msg user"><div class="ai-bubble">${esc(m.text)}</div></div>`
            : `<div class="ai-msg assistant"><div class="ai-bubble">${formatAiText(m.text)}</div></div>`
          ).join('')}
        </div>
        <form class="ai-panel-footer" onsubmit="handleSendAiMessage(event)">
          <input type="text" id="aiInput" class="ai-input" placeholder="Ask about your inventory..." autocomplete="off">
          <button type="submit" id="aiSendBtn" class="ai-send-btn">Send</button>
        </form>
      </div>
    `;
  }

  function renderApp() {
    const appEl = document.getElementById('app');
    if (!appEl) return;

    const clean = currentRoute.split('?')[0];

    if (clean === '/login') {
      appEl.innerHTML = pageLogin() + '<div id="toastWrap" class="toast-wrap"></div>';
      return;
    }
    if (clean === '/signup') {
      appEl.innerHTML = pageSignup() + '<div id="toastWrap" class="toast-wrap"></div>';
      return;
    }
    if (clean === '/forgot-password') {
      appEl.innerHTML = pageForgotPassword() + '<div id="toastWrap" class="toast-wrap"></div>';
      return;
    }
    if (clean === '/verify-otp') {
      appEl.innerHTML = pageVerifyOtp() + '<div id="toastWrap" class="toast-wrap"></div>';
      setTimeout(() => {
        const b = document.getElementById('otp_0');
        if (b) b.focus();
      }, 50);
      return;
    }
    if (clean === '/create-password' || clean === '/reset-password') {
      appEl.innerHTML = pageCreatePassword() + '<div id="toastWrap" class="toast-wrap"></div>';
      return;
    }

    let pageHtml = '';

    if (clean === '/dashboard' || clean === '') {
      pageHtml = pageDashboard();
    } else if (clean === '/products') {
      pageHtml = pageProducts();
    } else if (clean.startsWith('/products/')) {
      const id = clean.split('/')[2];
      pageHtml = pageProductDetail(id);
    } else if (clean === '/receipts') {
      pageHtml = pageReceipts();
    } else if (clean === '/deliveries' || clean === '/delivery') {
      pageHtml = pageDeliveries();
    } else if (clean === '/transfers') {
      pageHtml = pageTransfers();
    } else if (clean === '/adjustments') {
      pageHtml = pageAdjustments();
    } else if (clean === '/ledger' || clean === '/history' || clean === '/moves') {
      pageHtml = pageLedger();
    } else if (clean === '/warehouses' || clean === '/locations') {
      pageHtml = pageWarehouses();
    } else if (clean === '/categories') {
      pageHtml = pageCategories();
    } else if (clean === '/reorder-rules' || clean === '/reordering-rules') {
      pageHtml = pageReorderRules();
    } else if (clean === '/profile') {
      pageHtml = pageProfile();
    } else if (clean === '/settings') {
      pageHtml = pageSettings();
    } else {
      pageHtml = pageDashboard();
    }

    appEl.innerHTML = `
      <div class="app-layout">
        ${renderSidebar()}
        <div class="main-wrapper">
          ${renderHeader()}
          <main class="page-body">
            ${pageHtml}
          </main>
        </div>
      </div>
      <div id="modalOverlay" class="modal-overlay" style="display:none;"></div>
      <div id="toastWrap" class="toast-wrap"></div>
      ${renderChatbot()}
    `;
  }

  renderApp();

})();

  </script>
</body>
</html>
